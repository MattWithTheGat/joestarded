<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dio Mansion</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: url("roblox.jpg") center/cover no-repeat;
        background-size: cover;
      }

      #grayscale-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: inherit;
        filter: grayscale(100%);
        opacity: 0.7;
        z-index: 9998;
        pointer-events: none;
        clip-path: circle(0% at 50% 50%);
        display: none;
      }

      .spread-grayscale {
        animation: spreadGrayscale 2s ease-out forwards;
      }

      .shrink-grayscale {
        animation: shrinkGrayscale 2s ease-out forwards;
      }

      @keyframes spreadGrayscale {
        from {
          clip-path: circle(0% at 50% 50%);
        }
        to {
          clip-path: circle(150% at 50% 50%);
        }
      }

      @keyframes shrinkGrayscale {
        from {
          clip-path: circle(150% at 50% 50%);
        }
        to {
          clip-path: circle(0% at 50% 50%);
          display: none;
        }
      }

      #black-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 2em;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        pointer-events: all;
      }

      .fade-out {
        animation: fadeOut 7.5s forwards;
        pointer-events: none;
      }

      @keyframes fadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          display: none;
        }
      }

      .right-images {
        position: fixed;
        top: 50%;
        right: 25px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 1;
      }

      .right-images img {
        width: 150px;
        height: auto;
        border: 2px solid white;
        border-radius: 10px;
        cursor: pointer;
      }

      .center-image {
        position: fixed;
        top: 75%;
        left: 35%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: auto;
        cursor: pointer;
        z-index: 1;
      }

      .bouncing-image {
        position: absolute;
        width: 100px;
        height: auto;
        z-index: 2;
        cursor: pointer;
      }

      .launch-effect {
        animation: launch 1s ease-out forwards;
      }

      @keyframes launch {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(0.1) translateY(-100vh);
        }
      }

      #fade-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        opacity: 0;
        pointer-events: none;
        z-index: 10001;
      }

      .fade-to-black {
        animation: fadeToBlack 3.8s forwards;
      }

      @keyframes fadeToBlack {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      #video-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10000;
      }

      #video-overlay video {
        max-width: 90%;
        max-height: 90%;
        border: 2px solid white;
        border-radius: 10px;
      }

      .frozen {
        pointer-events: none !important;
        cursor: default !important;
      }

      .paused {
        animation-play-state: paused !important;
      }
    </style>
  </head>
  <body>
    <div id="black-overlay">Click to Enter</div>

    <div id="grayscale-overlay"></div>

    <div class="right-images">
      <img src="584fcc516a5ae41a83ddee89.png" alt="Top Image" id="img1" />
      <img src="580b585b2edbce24c47b2b84.png" alt="Bottom Image" id="img2" />
    </div>

    <img
      src="./center.png"
      alt="Center Image"
      class="center-image"
      id="center-img"
    />

    <img
      src="dumbdog.png"
      alt="Bouncing Dog"
      class="bouncing-image"
      id="bouncing-dog-0"
    />

    <div id="video-overlay">
      <video id="video" controls></video>
    </div>

    <div id="fade-overlay"></div>

    <audio id="bg-music" src="diomusic.mp3" loop></audio>
    <audio id="gravity-sound" src="doyoubelieveingravity.mp3"></audio>
    <audio id="click-sound" src="clicksound.mp3"></audio>
    <audio id="dojyaaan-sound" src="Dojyaaan Sound Effect.mp3"></audio>
    <audio id="zaowlrd-sound" src="zaowlrd.mp3"></audio>
    <audio id="time-resumes-sound" src="time-resumes.mp3"></audio>

    <script>
      const overlay = document.getElementById("black-overlay");
      const grayscaleOverlay = document.getElementById("grayscale-overlay");
      const audio = document.getElementById("bg-music");
      const gravitySound = document.getElementById("gravity-sound");
      const clickSound = document.getElementById("click-sound");
      const dojyaaanSound = document.getElementById("dojyaaan-sound");
      const zaowlrdSound = document.getElementById("zaowlrd-sound");
      const timeResumesSound = document.getElementById("time-resumes-sound");
      const videoOverlay = document.getElementById("video-overlay");
      const video = document.getElementById("video");
      const centerImg = document.getElementById("center-img");
      const fadeOverlay = document.getElementById("fade-overlay");
      let dogClickCount = 0;
      let dogCount = 1;
      let isExperienceStarted = false;
      let isFrozen = false;
      let isCooldown = false;
      let inputBuffer = "";
      let animationFrameId = null;

      function startExperience() {
        overlay.classList.add("fade-out");

        audio.volume = 0;
        audio.play();
        let vol = 0;
        const fadeDuration = 5000;
        const interval = 50;
        const step = interval / fadeDuration;

        const fadeIn = setInterval(() => {
          if (vol < 1) {
            vol += step;
            audio.volume = Math.min(vol, 0.25);
          } else {
            clearInterval(fadeIn);
          }
        }, interval);

        const initialDojyaaan = new Audio("Dojyaaan Sound Effect.mp3");
        initialDojyaaan.play();

        overlay.removeEventListener("click", startExperience);
        isExperienceStarted = true;

        overlay.addEventListener("animationend", () => {
          overlay.remove();
        });
      }

      overlay.addEventListener("click", startExperience);

      function playVideo(src) {
        video.src = src;
        videoOverlay.style.display = "flex";
        video.currentTime = 0;
        video.play();
      }

      document.getElementById("img1").addEventListener("click", () => {
        if (!isFrozen) playVideo("donnutt.mp4");
      });

      document.getElementById("img2").addEventListener("click", () => {
        if (!isFrozen) playVideo("soccer.mp4");
      });

      videoOverlay.addEventListener("click", () => {
        if (!isFrozen) {
          video.pause();
          videoOverlay.style.display = "none";
        }
      });

      video.addEventListener("click", (e) => e.stopPropagation());

      centerImg.addEventListener("click", () => {
        if (!isFrozen) {
          gravitySound.play();
          fadeOverlay.classList.add("fade-to-black");
          fadeOverlay.addEventListener(
            "animationend",
            () => {
              window.location.href = "florida.html";
            },
            { once: true }
          );
        }
      });

      let dogs = [
        {
          id: "bouncing-dog-0",
          x: Math.random() * (window.innerWidth - 100),
          y: Math.random() * (window.innerHeight - 100),
          speedX: 2 * (Math.random() < 0.5 ? 1 : -1),
          speedY: 2 * (Math.random() < 0.5 ? 1 : -1),
          active: true,
          element: document.getElementById("bouncing-dog-0"),
        },
      ];

      function createNewDog() {
        const newDogElement = dogs[0].element.cloneNode(true);
        newDogElement.id = `bouncing-dog-${dogCount}`;
        newDogElement.classList.remove("launch-effect");
        newDogElement.style.display = "block";
        const newX = Math.random() * (window.innerWidth - 100);
        const newY = Math.random() * (window.innerHeight - 100);
        newDogElement.style.left = `${newX}px`;
        newDogElement.style.top = `${newY}px`;
        document.body.appendChild(newDogElement);

        const newDog = {
          id: `bouncing-dog-${dogCount}`,
          x: newX,
          y: newY,
          speedX: 2 * (Math.random() < 0.5 ? 1 : -1),
          speedY: 2 * (Math.random() < 0.5 ? 1 : -1),
          active: true,
          element: newDogElement,
        };

        dogs.push(newDog);
        console.log(
          `Created dog ${newDog.id} at x: ${newDog.x}, y: ${newDog.y}`
        );
        newDogElement.addEventListener("click", () =>
          handleDogClick(newDog, newDogElement)
        );
        const dojyaaan = new Audio("Dojyaaan Sound Effect.mp3");
        dojyaaan.play();
        dogCount++;
      }

      function handleDogClick(dog, element) {
        if (dog.active && !isFrozen) {
          dogClickCount++;
          console.log(`Dog ${dog.id} clicked, total clicks: ${dogClickCount}`);
          dog.active = false;
          const newClickSound = new Audio("clicksound.mp3");
          newClickSound.play();
          element.classList.add("launch-effect");
          element.addEventListener(
            "animationend",
            () => {
              element.style.display = "none";
              setTimeout(() => {
                dog.x = Math.random() * (window.innerWidth - 100);
                dog.y = Math.random() * (window.innerHeight - 100);
                dog.speedX = 2 * (Math.random() < 0.5 ? 1 : -1);
                dog.speedY = 2 * (Math.random() < 0.5 ? 1 : -1);
                element.style.left = dog.x + "px";
                element.style.top = dog.y + "px";
                element.style.display = "block";
                element.classList.remove("launch-effect");
                dog.active = true;
                const respawnDojyaaan = new Audio("Dojyaaan Sound Effect.mp3");
                respawnDojyaaan.play();
                console.log(
                  `Dog ${dog.id} respawned at x: ${dog.x}, y: ${dog.y}`
                );

                if (dogClickCount <= 10) {
                  createNewDog();
                  console.log(
                    `Total dogs after click ${dogClickCount}: ${dogs.length}`
                  );
                }

                if (dogClickCount > 10) {
                  const currentDogCount = dogs.length;
                  console.log(
                    `Current dogs: ${currentDogCount}, spawning ${currentDogCount} new dogs`
                  );
                  for (let i = 0; i < currentDogCount; i++) {
                    createNewDog();
                  }
                  console.log(`Total dogs after spawn: ${dogs.length}`);
                }
              }, 6000);
            },
            { once: true }
          );
        }
      }

      dogs[0].element.addEventListener("click", () =>
        handleDogClick(dogs[0], dogs[0].element)
      );

      function updateDogPositions() {
        if (!isFrozen) {
          dogs.forEach((dog, index) => {
            if (
              !dog ||
              typeof dog.x === "undefined" ||
              typeof dog.y === "undefined"
            ) {
              console.error(`Dog at index ${index} is invalid:`, dog);
              return;
            }

            if (!dog.active) return;

            dog.x += dog.speedX;
            dog.y += dog.speedY;

            if (dog.x <= 0 || dog.x >= window.innerWidth - 100) {
              dog.speedX = -dog.speedX;
              dog.x = Math.max(0, Math.min(dog.x, window.innerWidth - 100));
            }
            if (dog.y <= 0 || dog.y >= window.innerHeight - 100) {
              dog.speedY = -dog.speedY;
              dog.y = Math.max(0, Math.min(dog.y, window.innerHeight - 100));
            }

            dog.element.style.left = dog.x + "px";
            dog.element.style.top = dog.y + "px";
          });
        }
        animationFrameId = requestAnimationFrame(updateDogPositions);
      }

      animationFrameId = requestAnimationFrame(updateDogPositions);

      function freezeEverything() {
        if (isFrozen || isCooldown || !isExperienceStarted) return;

        console.log("Freezing everything for 10 seconds");
        isFrozen = true;

        grayscaleOverlay.style.display = "block";
        grayscaleOverlay.classList.add("spread-grayscale");

        audio.pause();
        gravitySound.pause();
        clickSound.pause();
        dojyaaanSound.pause();
        if (video.playing) video.pause();

        document
          .querySelectorAll(
            ".right-images img, .center-image, .bouncing-image, #video-overlay"
          )
          .forEach((el) => el.classList.add("frozen"));

        dogs.forEach((dog) => {
          if (dog && dog.element) {
            dog.element.classList.add("paused");
          }
        });

        cancelAnimationFrame(animationFrameId);

        setTimeout(() => {
          console.log("Resuming everything");
          isFrozen = false;

          timeResumesSound.currentTime = 0;
          timeResumesSound.play();

          grayscaleOverlay.classList.remove("spread-grayscale");
          grayscaleOverlay.classList.add("shrink-grayscale");
          grayscaleOverlay.addEventListener(
            "animationend",
            () => {
              grayscaleOverlay.style.display = "none";
              grayscaleOverlay.classList.remove("shrink-grayscale");
            },
            { once: true }
          );

          audio.play();
          if (video.paused && videoOverlay.style.display === "flex")
            video.play();

          document
            .querySelectorAll(
              ".right-images img, .center-image, .bouncing-image, #video-overlay"
            )
            .forEach((el) => el.classList.remove("frozen"));

          dogs.forEach((dog) => {
            if (dog && dog.element) {
              dog.element.classList.remove("paused");
            }
          });

          animationFrameId = requestAnimationFrame(updateDogPositions);

          isCooldown = true;
          setTimeout(() => {
            isCooldown = false;
            console.log("world can use looollll");
          }, 20000);
        }, 10000);
      }

      document.addEventListener("keydown", (e) => {
        if (!isExperienceStarted || isFrozen || isCooldown) return;

        inputBuffer += e.key.toLowerCase();
        if (inputBuffer.length > 5) {
          inputBuffer = inputBuffer.slice(-5);
        }

        if (inputBuffer === "world") {
          zaowlrdSound.currentTime = 0;
          zaowlrdSound.play();
          freezeEverything();

          inputBuffer = "";
        }
      });
    </script>
  </body>
</html>
